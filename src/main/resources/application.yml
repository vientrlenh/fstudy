spring: 
    application: 
        name: fstudy
    threads: 
        virtual: 
            enabled: true
    datasource: 
        url: jdbc:postgresql://${DB_URL:}/${DB_NAME:}
        username: ${DB_USER:}
        password: ${DB_PASSWORD:}
    jpa: 
        hibernate:
            ddl-auto: update
        show-sql: true
        open-in-view: ${JPA_OPEN_IN_VIEW_ENABLED:false}

springdoc:
    api-docs: 
        enabled: ${API_DOCS_ENABLED:false}
    swagger-ui:
        enabled: ${SWAGGER_UI_ENABLED:false}

app:
    cors:
        allowed-origins:
        - ${ALLOWED_ORIGIN_1:}
        - ${ALLOWED_ORIGIN_2:}

    jwt: 
        secret: ${JWT_SECRET:}
        expiration-ms: ${JWT_EXPIRATION_MS:}
    
