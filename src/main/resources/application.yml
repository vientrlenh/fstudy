spring: 
    application: 
        name: fstudy
    threads: 
        virtual: 
            enabled: true
    datasource: 
        url: jdbc:postgresql://${DB_URL:}/${DB_NAME:}
        username: ${DB_USER:}
        password: ${DB_PASSWORD:}
    jpa: 
        properties: 
            hibernate: 
                dialect: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: update
        show-sql: true

app:
    cors:
        allowed-origins:
        - ${ALLOWED_ORIGIN_1:}
        - ${ALLOWED_ORIGIN_2:}

    jwt: 
        secret: ${JWT_SECRET:}
        expiration-ms: ${JWT_EXPIRATION_MS:}
    
